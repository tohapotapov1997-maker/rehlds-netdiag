name: Build ReHLDS NetDiag

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "src/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "version_script.lds"
      - ".github/workflows/build.yml"

jobs:
  linux-i386:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit build tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386

      - name: Fetch ReHLDS SDK dependencies
        run: bash scripts/fetch_deps.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Verify binary
        run: |
          file build/rehlds_netdiag_mm_i386.so
          readelf -h build/rehlds_netdiag_mm_i386.so
          ldd build/rehlds_netdiag_mm_i386.so || true

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp build/rehlds_netdiag_mm_i386.so artifact/
          cp INSTALL.txt artifact/

      - name: Upload compiled .so
        uses: actions/upload-artifact@v4
        with:
          name: rehlds-netdiag-linux-i386
          path: artifact/
          if-no-files-found: error
